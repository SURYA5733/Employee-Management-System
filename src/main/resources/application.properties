# ===================================================================
# Employee Management System - MySQL Configuration
# ===================================================================
spring.application.name=employee-management-system
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection Settings
# -------------------------------------------------------------------
# The parameter 'createDatabaseIfNotExist=true' automatically creates the database 'ems_db' if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_system_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:surya}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration for MySQL
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Logging Settings
# -------------------------------------------------------------------
logging.level.com.ems=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
